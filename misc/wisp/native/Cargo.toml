[package]
name = "wisp-server-fast"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["napi8"] }
napi-derive = "3"
tokio = { version = "1", features = ["full"] }
sockudo-ws = "1"
papaya = "0.2"
parking_lot = "0.12"
ahash = "0.8"
json-steroids = "0.2"
json-steroids-derive = "0.2"
smallvec = { version = "1", features = ["union"] }
argon2 = "0.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
