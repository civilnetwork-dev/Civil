services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: civil
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: civil
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Bound to the loopback interface only: reachable from this machine for
    # local dev and tooling, never from the network. Dropping the 127.0.0.1
    # prefix would publish Postgres on every interface.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civil -d civil"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    # Loopback only, same reasoning as Postgres above.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    # Named so drizzle-studio can run this same image rather than building the
    # Dockerfile a second time.
    image: civil-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Defaults to obscura-rs, unchanged from before this existed. Set
        # OBFUSCATE_ENGINE=obfuscatti on the host before `compose build`/`up`
        # to opt into misc/obfuscatti instead -- see Dockerfile.
        OBFUSCATE_ENGINE: "${OBFUSCATE_ENGINE:-obscura}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-9876}:9876"
    volumes:
      - ./data/schoolDistricts:/app/misc/schoolDistricts/data
    environment:
      PORT: 9876
      REVERSE_PROXY: "true"
      DATABASE_URL: postgresql://civil:${DB_PASSWORD}@postgres:5432/civil
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      PATREON_CLIENT_ID: ${PATREON_CLIENT_ID}
      PATREON_CLIENT_SECRET: ${PATREON_CLIENT_SECRET}
      IBOSS_SECURITY_KEY: ${IBOSS_SECURITY_KEY}
      CHII_DOMAIN: ${CHII_DOMAIN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9876/health 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Reuses the app image, which already carries drizzle-kit. It used to build
  # the same Dockerfile itself, in parallel with app, so every `up --build`
  # paid for two full builds: twice the time, twice the memory in the Podman
  # VM, and twice the layers left behind on its disk. `never` because the
  # image only ever comes from app's build, not from a registry.
  drizzle-studio:
    image: civil-app
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4983:4983"
    environment:
      DATABASE_URL: postgresql://civil:${DB_PASSWORD}@postgres:5432/civil
    command: ["sh", "-c", "bun run db:studio"]

# Postgres and Redis own their storage through named volumes rather than host
# bind mounts. Both need to chown/chmod their data directory (Postgres refuses
# to start unless it is 0700 and owned by the server user), which a bind mount
# backed by a Windows path cannot support -- under Podman on Windows the host
# directory reaches the VM as drvfs and chmod fails with EPERM. Named volumes
# live on the VM's Linux filesystem, so this works the same on every platform.
# Use `bun run db:studio` or pg_dump to get at the data, not the host filesystem.
volumes:
  postgres-data:
  redis-data:

